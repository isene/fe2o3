name: Install test

# A clean machine, one user who can sudo, then the install from the README.
# test/install-check.sh starts every program it fetched. Runs weekly too,
# since each app ships from its own repo.

on:
  push:
    paths:
      - README.md
      - test/install-check.sh
      - .github/workflows/install-test.yml
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # debian:12 has an older glibc: there the static binaries must run, the others are left out.
        image: ["ubuntu:24.04", "ubuntu:26.04", "debian:13", "debian:12", "archlinux:latest"]
    container: ${{ matrix.image }}
    steps:
      - name: A clean machine with one user who can sudo
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y sudo git curl ca-certificates
          else
            pacman -Sy --noconfirm sudo git curl
          fi
          useradd -m tester
          echo 'tester ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/tester
      - name: Install as the README says, then check
        run: |
          sudo -iu tester bash -c '
            git clone -q https://github.com/isene/fe2o3 &&
            cd fe2o3 &&
            git checkout -q ${{ github.sha }} &&
            test/install-check.sh'
